<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#2C3E2D" />
    <meta name="color-scheme" content="light dark" />

    <!-- Primary Meta Tags -->
    <title>Willow Vibes — Meditation, Sleep & Wellness App</title>
    <meta name="title" content="Willow Vibes — Meditation, Sleep & Wellness App" />

    <!-- Preload LCP hero image directly from HTML so it starts downloading immediately,
         without waiting for the JS bundle to parse and evaluate. -->
    <link rel="preload" as="image" href="/calm-hero-mountain.webp" fetchpriority="high" />

    <!-- Preconnect to font origins (saves ~300ms FCP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Async font loading: Cormorant Garamond (display) + Karla (body). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Karla:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://fonts.gstatic.com/s/karla/v31/qkBbXvYC6trAT55ZBi1ueQVIjQTD-JqqFENLR7fHGw.woff2"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Karla:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>

        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Karla:wght@300;400;500;600;700&display=swap"
      />
    </noscript>

    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Facebook -->

    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Willow Vibes — Meditation, Sleep & Wellness App" />

    <meta property="og:url" content="https://willowvibes.com/" />

    <!-- Structured Data — Organization -->

    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Willow Vibes",
      "url": "https://www.willowvibes.com",

      "description": "The complete wellness platform — meditation, breathwork, sleep stories, AI coaching, mood tracking, SOS relief, and sound therapy for mind, body, and sleep.",
      "sameAs": [
        "https://twitter.com/willowvibes"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@willowvibes.com",
        "contactType": "Customer Support"
      }
    }
    </script>

    <!-- Structured Data — Website with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Willow Vibes",
      "url": "https://willowvibes.com",
      "inLanguage": "en-US"
    }
    </script>

    <!-- Structured Data — FAQPage (matches landing FAQ section) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "Is Willow Vibes for beginners?", "acceptedAnswer": { "@type": "Answer", "text": "Absolutely. Willow is composed for people who find traditional meditation difficult. The 30-day foundation begins with five quiet minutes a day and grows with you." } },
        { "@type": "Question", "name": "What makes Willow Vibes different?", "acceptedAnswer": { "@type": "Answer", "text": "Science, not spectacle. Every practice is research-informed, and the Sound Bed Designer, AI Coach, and adaptive recommendations respond to your real stress levels." } },
        { "@type": "Question", "name": "How does the free trial work?", "acceptedAnswer": { "@type": "Answer", "text": "Seven complimentary days of Willow Plus — full access, no commitment. We won't ask for a card today, and cancellation is one quiet tap." } },
        { "@type": "Question", "name": "What if it doesn't work for me?", "acceptedAnswer": { "@type": "Answer", "text": "A 30-day money-back guarantee, no questions asked. Try every session. If you don't feel a measurable shift, we refund every cent." } },
        { "@type": "Question", "name": "How long are the sessions?", "acceptedAnswer": { "@type": "Answer", "text": "Most sessions sit between 5 and 20 minutes. SOS Rescue is under three minutes — for the moments calm cannot wait." } },
        { "@type": "Question", "name": "Can I practice offline?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Download favourite sessions and soundscapes so the practice travels with you, with or without signal." } },
        { "@type": "Question", "name": "Is the Lifetime plan really lifetime?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. One payment, every future season and AI upgrade included — forever. No subscription, no upsell, no tiers." } }
      ]
    }
    </script>
  </head>
  <body>
    <style>
      #wv-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#F5F1E8;z-index:9999;transition:opacity .5s ease}
      #wv-splash.hide{opacity:0;pointer-events:none}
      #wv-splash img{width:96px;height:96px;border-radius:24px;animation:wv-breathe 2.4s ease-in-out infinite;box-shadow:0 14px 32px -12px rgba(44,62,45,.35)}
      #wv-splash span{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;letter-spacing:.04em;color:#2C3E2D;opacity:.85}
      @keyframes wv-breathe{0%,100%{transform:scale(.94);filter:drop-shadow(0 0 0 rgba(111,140,102,0))}50%{transform:scale(1.06);filter:drop-shadow(0 0 22px rgba(111,140,102,.45))}}
    </style>
    <div id="wv-splash" aria-hidden="true">
      <img src="/favicon.png" alt="Willow Vibes" />
      <span>Willow Vibes</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function(){
        var hidden=false;
        function hide(){if(hidden)return;hidden=true;var s=document.getElementById('wv-splash');if(!s)return;s.classList.add('hide');setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},600);}
        var root=document.getElementById('root');
        var obs=new MutationObserver(function(){if(root&&root.childElementCount>0){obs.disconnect();hide();}});
        if(root)obs.observe(root,{childList:true});
        setTimeout(hide,4000);
      })();
    </script>
  </body>
</html>
