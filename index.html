<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1230" />
    <meta name="color-scheme" content="light dark" />

    <!-- Primary Meta Tags -->
    <title>Willow Vibes — The Complete Wellness System for Mind, Body & Sleep</title>
    <meta name="title" content="Willow Vibes — The Complete Wellness System for Mind, Body & Sleep" />
    <meta name="description" content="The all-in-one wellness platform for modern life. Guided meditation, sleep stories, breathwork, AI coaching, mood tracking, SOS relief & sound therapy — designed by experts, trusted by thousands. Begin free." />
    <meta name="keywords" content="wellness app, mental health app, meditation platform, mindfulness, sleep stories, breathwork, anxiety relief, stress management, AI wellness coach, sound therapy, daily rituals, mood tracking, calm alternative, headspace alternative, premium wellness" />
    <meta name="author" content="Willow Vibes" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://www.willowvibes.com/" />

    <!-- Preload LCP hero image directly from HTML so it starts downloading immediately,
         without waiting for the JS bundle to parse and evaluate. -->
    <link rel="preload" as="image" href="/calm-hero-mountain.webp" fetchpriority="high" />

    <!-- Preconnect to font origins (saves ~300ms FCP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Async font loading: avoids render-blocking the LCP H1 text. Fonts swap in via display=swap. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Fraunces:wght@300;400;500;600&display=swap"
    />
    <!-- Preload critical font files directly to shorten the network dependency chain (HTML→CSS→fonts.css→woff2). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://fonts.gstatic.com/s/plusjakartasans/v12/LDIoaomQNQcsA88c7O9yZ4KMCoOg4Ko20yygg_vb.woff2"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Fraunces:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Fraunces:wght@300;400;500;600&display=swap"
      />
    </noscript>

    <!-- Favicons & app icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Willow Vibes" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Willow Vibes — The Complete Wellness System" />
    <meta property="og:description" content="The all-in-one platform for mind, body & sleep. Meditation, breathwork, sleep stories, AI coaching, mood tracking & sound therapy — designed by experts, loved by thousands." />

    <meta property="og:url" content="https://www.willowvibes.com/" />
    <meta property="og:image" content="https://www.willowvibes.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://www.willowvibes.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Willow Vibes — The complete wellness system for mind, body, and sleep." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@willowvibes" />
    <meta name="twitter:creator" content="@willowvibes" />
    <meta name="twitter:title" content="Willow Vibes — The Complete Wellness System" />
    <meta name="twitter:description" content="The all-in-one platform for mind, body & sleep. Meditation, breathwork, sleep stories, AI coaching, mood tracking & sound therapy." />
    <meta name="twitter:image" content="https://www.willowvibes.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Willow Vibes — The complete wellness system" />

    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Willow Vibes" />

    <!-- Structured Data — Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Willow Vibes",
      "url": "https://www.willowvibes.com",
      "logo": "https://www.willowvibes.com/favicon.png",
      "description": "The complete wellness platform — meditation, breathwork, sleep stories, AI coaching, mood tracking, SOS relief, and sound therapy for mind, body, and sleep.",
      "sameAs": [
        "https://twitter.com/willowvibes"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@willowvibes.com",
        "contactType": "Customer Support"
      }
    }
    </script>

    <!-- Structured Data — Software Application -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Willow Vibes",
      "url": "https://www.willowvibes.com",
      "image": "https://www.willowvibes.com/og-image.jpg",
      "description": "The complete wellness system — guided meditation, breathwork, sleep stories, AI coaching, mood tracking, SOS relief, sound therapy, and daily rituals in one beautifully crafted app.",
      "applicationCategory": "HealthApplication",
      "applicationSubCategory": "Wellness, Meditation & Mental Health",
      "operatingSystem": "Web, iOS, Android",
      "offers": [
        {
          "@type": "Offer",
          "name": "Willow Plus Monthly",
          "price": "9.99",
          "priceCurrency": "USD",
          "description": "Full access, billed monthly. 7-day free trial."
        },
        {
          "@type": "Offer",
          "name": "Willow Plus Yearly",
          "price": "59.99",
          "priceCurrency": "USD",
          "description": "Full access, billed yearly. Best value — save 50%."
        },
        {
          "@type": "Offer",
          "name": "Founders Lifetime",
          "price": "199.00",
          "priceCurrency": "USD",
          "description": "One-time payment for lifetime access. Limited to 1,000 founders."
        }
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "1000",
        "bestRating": "5",
        "worstRating": "1"
      }
    }
    </script>

    <!-- Structured Data — Website with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Willow Vibes",
      "url": "https://www.willowvibes.com",
      "inLanguage": "en-US"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
